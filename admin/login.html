<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Eyezik E-Test</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="auth-page" data-page="admin-login">

  <aside class="auth-aside">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/images/logo.svg" alt="">
      <span class="brand-text"><strong>Eyezik E-Test</strong><small>Admin panel</small></span>
    </a>
    <div>
      <h1>Manage examinations, questions and results.</h1>
      <p>This area is for examiners. Students should use the student login page.</p>
    </div>
    <div class="aside-bubbles" aria-hidden="true">
      <span class="bubble">A</span><span class="bubble">B</span><span class="bubble">C</span><span class="bubble filled">D</span>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-card admin-login-card">
      <a class="back-link" href="../index.html">Back to home page</a>
      <h2>Admin login</h2>
      <p class="subtitle">Enter your administrator username and password.</p>

      <div id="formAlert" class="alert" role="alert" hidden></div>

      <form id="adminLoginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="loginButton" class="btn btn-primary btn-block btn-lg">Log in</button>
      </form>

      <p class="auth-links">Student? <a href="../login.html">Go to student login</a></p>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
